services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prompttasksystem-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SERVER_PASSWORD:-Your_strong_password123}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SQL_SERVER_PASSWORD:-Your_strong_password123} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/PromptTaskApi.Api/Dockerfile
    container_name: prompttasksystem-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PromptTaskDb;User Id=sa;Password=${SQL_SERVER_PASSWORD:-Your_strong_password123};TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      LanguageModel__Provider: "${LANGUAGE_MODEL_PROVIDER:-Fake}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAI__Model: "${OPENAI_MODEL:-gpt-4o-mini}"
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      sqlserver:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: src/PromptTaskApi.Worker/Dockerfile
    container_name: prompttasksystem-worker
    environment:
      DOTNET_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PromptTaskDb;User Id=sa;Password=${SQL_SERVER_PASSWORD:-Your_strong_password123};TrustServerCertificate=True"
      LanguageModel__Provider: "${LANGUAGE_MODEL_PROVIDER:-Fake}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAI__Model: "${OPENAI_MODEL:-gpt-4o-mini}"
      PromptProcessing__PollingIntervalSeconds: "3"
      PromptProcessing__MaxRetryAttempts: "3"
    depends_on:
      sqlserver:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "/api"
    container_name: prompttasksystem-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlserver_data:
